name: Release Docker Images
run-name: ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ironrag-public-images
  queue: max
  cancel-in-progress: false

jobs:
  provenance:
    if: github.event.release.prerelease == false && github.event.release.author.id == 82709956
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Refuse foreign image versions before building any role
        run: python3 scripts/public_images.py all
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish:
    needs: provenance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: pipingspace/ironrag-backend
            context: .
            file: apps/api/Dockerfile
            gha_scope: ironrag-backend
          - name: frontend
            image: pipingspace/ironrag-frontend
            context: apps/web
            file: apps/web/Dockerfile
            gha_scope: ironrag-frontend
          # The connectors ship on the stack version, from the same release:
          # one tag moves the backend, the interface and everything that feeds
          # them together. They used to be five repositories whose images were
          # published on their own cadence against a pinned copy of the
          # framework, which is how one of them shipped without the fix its
          # release notes claimed.
          - name: bookstack-connector
            image: pipingspace/ironrag.bookstack
            context: connectors
            file: connectors/Dockerfile
            target: bookstack
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-bookstack
          - name: confluence-connector
            image: pipingspace/ironrag.confluence
            context: connectors
            file: connectors/Dockerfile
            target: confluence
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-confluence
          - name: gitrepos-connector
            image: pipingspace/ironrag.gitrepos
            context: connectors
            file: connectors/Dockerfile
            target: gitrepos
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-gitrepos
          - name: youtrack-connector
            image: pipingspace/ironrag.youtrack
            context: connectors
            file: connectors/Dockerfile
            target: youtrack
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-youtrack

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check immutable image and latest provenance
        id: provenance
        run: python3 scripts/public_images.py prepare --image "${IMAGE#pipingspace/}"
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read selected source descriptor
        id: descriptor
        run: |
          echo "json=$(python3 -c 'import json; print(json.dumps(json.load(open(".public-release.json")), separators=(",", ":")))')" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build and push ${{ matrix.name }} image
        if: steps.provenance.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Empty for the single-stage backend and frontend images; the
          # connectors share one Dockerfile and differ only by target.
          target: ${{ matrix.target }}
          # Empty means the runner's own platform, which is what the backend and
          # frontend have always built.
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.ironrag.source-commit=${{ fromJSON(steps.descriptor.outputs.json).source_commit }}
            io.ironrag.pipeline-id=${{ fromJSON(steps.descriptor.outputs.json).pipeline_id }}
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ matrix.gha_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.gha_scope }}

      - name: Verify published version and all runnable platforms
        run: python3 scripts/public_images.py verify --image "${IMAGE#pipingspace/}"
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reconcile latest after the build
        id: advance
        run: python3 scripts/public_images.py prepare --image "${IMAGE#pipingspace/}"
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Advance stable latest without rebuilding
        if: steps.advance.outputs.latest == 'true'
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ github.event.release.tag_name }}
