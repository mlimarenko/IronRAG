name: Release Docker Images
run-name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker tag for both images (e.g. v0.1.0)"
        required: true
        type: string
      push_latest:
        description: "Also push the latest tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-docker-images-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: pipingspace/ironrag-backend
            context: .
            file: apps/api/Dockerfile
            gha_scope: ironrag-backend
          - name: frontend
            image: pipingspace/ironrag-frontend
            context: apps/web
            file: apps/web/Dockerfile
            gha_scope: ironrag-frontend
          # The connectors ship on the stack version, from the same release:
          # one tag moves the backend, the interface and everything that feeds
          # them together. They used to be five repositories whose images were
          # published on their own cadence against a pinned copy of the
          # framework, which is how one of them shipped without the fix its
          # release notes claimed.
          - name: bookstack-connector
            image: pipingspace/ironrag.bookstack
            context: connectors
            file: connectors/Dockerfile
            target: bookstack
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-bookstack
          - name: confluence-connector
            image: pipingspace/ironrag.confluence
            context: connectors
            file: connectors/Dockerfile
            target: confluence
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-confluence
          - name: gitrepos-connector
            image: pipingspace/ironrag.gitrepos
            context: connectors
            file: connectors/Dockerfile
            target: gitrepos
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-gitrepos
          - name: youtrack-connector
            image: pipingspace/ironrag.youtrack
            context: connectors
            file: connectors/Dockerfile
            target: youtrack
            # The connector images were published for both architectures from
            # their own repositories; the same tag must not narrow to amd64.
            platforms: linux/amd64,linux/arm64
            gha_scope: ironrag-connector-youtrack

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_latest) }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Empty for the single-stage backend and frontend images; the
          # connectors share one Dockerfile and differ only by target.
          target: ${{ matrix.target }}
          # Empty means the runner's own platform, which is what the backend and
          # frontend have always built.
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.gha_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.gha_scope }}
