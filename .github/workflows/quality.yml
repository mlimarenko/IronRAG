name: Quality gates

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          curl --fail --location --retry 3 \
            --output "$directory/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "$directory/$archive" | sha256sum --check
          tar -xzf "$directory/$archive" -C "$directory" gitleaks
          sudo install -m 0755 "$directory/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$version"

      - name: Scan every commit introduced by this event
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            range="$PR_BASE_SHA..$GITHUB_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$GITHUB_SHA"
          elif parent="$(git rev-parse --verify --end-of-options 'HEAD^' 2>/dev/null)"; then
            range="$parent..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          make secret-check GITLEAKS_LOG_OPTS="$range"

  audit:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.4.0"
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.17.0

      - name: Install pinned Rust audit tools
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.20.2

      - name: Audit Rust dependency security
        run: make backend-audit backend-deny

      - name: Audit frontend lockfile
        working-directory: apps/web
        run: npm audit --audit-level=low

  verify:
    name: Build and functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/ci
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      IRONRAG_DATABASE_URL: postgres://postgres:${{ github.run_id }}@127.0.0.1:5432/ironrag_ci
      IRONRAG_REDIS_URL: redis://127.0.0.1:6379/
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: ironrag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ironrag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.4.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm version declared by the frontend
        run: |
          npm install --global --ignore-scripts npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev pkg-config

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned whole-workspace static tools
        run: cargo install --locked cargo-machete --version 0.9.2

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"

      - name: Verify build, contracts and functional tests
        run: >-
          make migration-check backend-test-fast contract-check
          frontend-typecheck frontend-test frontend-swagger-check frontend-build
          compose-check helm-chart-check mem-budget-check install-script-check
          mcp-consumer-contract-check benchmark-contract-test ci-python-functional
          connectors-typecheck connectors-lock-check
          BACKEND_CARGO_TARGET_DIR="$CARGO_TARGET_DIR"

      - name: Run style and static analysis (advisory)
        continue-on-error: true
        run: >-
          make backend-fmt-check backend-lint backend-doc backend-unused-deps
          frontend-lint frontend-format-check frontend-deadcode frontend-i18n-audit
          frontend-color-gate frontend-bundle-check frontend-size-limit
          connectors-lint connectors-format-check
          BACKEND_CARGO_TARGET_DIR="$CARGO_TARGET_DIR"

      - name: Run workspace and database-backed lifecycle tests
        run: |
          set -euo pipefail
          cargo test -p ironrag-contracts --all-targets
          make backend-test-integration BACKEND_CARGO_TARGET_DIR="$CARGO_TARGET_DIR"

      - name: Measure frontend coverage (advisory)
        continue-on-error: true
        run: npm --prefix apps/web run test:coverage

      - name: Run browser flows
        run: npm --prefix apps/web run test:e2e
