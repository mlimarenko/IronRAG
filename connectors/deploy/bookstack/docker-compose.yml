# IronRAG ↔ BookStack connector — deployment compose.
#
#   cp .env.example .env             # BOOKSTACK_* + IRONRAG_* + ADMIN_BEARER_TOKEN
#   cp routing.yaml.example routing.yaml   # map shelves/books -> workspace/library refs
#   docker compose up -d
#   docker compose logs -f
#
# `image:` pulls the image published with the IronRAG release named by
# IRONRAG_VERSION. Connectors ship on the stack version — there is no separate
# connector release. To run a locally built image, comment `image:` and
# uncomment `build:`.
services:
  bookstack-connector:
    image: pipingspace/ironrag.bookstack:${IRONRAG_VERSION:?set IRONRAG_VERSION to the IronRAG release you are running}
    # build:
    #   context: ../..
    #   target: bookstack
    #   args: { APP_VERSION: "${IRONRAG_VERSION:?set IRONRAG_VERSION}" }
    container_name: ironrag-bookstack-connector
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Routing rules (read-only).
      - ./routing.yaml:/app/routing.yaml:ro
      # Persistent SQLite cursor so a restart ships only the diff.
      - bookstack-state:/var/lib/ironrag-connector
    # Needed for RUN_MODE=both/webhook (inbound /webhook/bookstack).
    # Bound to localhost; front it with a TLS reverse proxy for public intake.
    ports:
      - "127.0.0.1:8088:8088"

volumes:
  bookstack-state:
