[project]
name = "ironrag-connectors"
# Connectors share the release version with the Cargo workspace.
version = "0.6.0"
description = "IronRAG source connectors and the adapter framework they share."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "IronRAG team" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "structlog>=24.4",
    "python-multipart>=0.0.31",
    # gitrepos parses repos.yaml; it resolved transitively before and is
    # declared here so the import cannot outlive the dependency.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.32",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
ironrag-connector = "ironrag_connector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ironrag_connector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Without --strict-markers a dropped marker declaration silently DESELECTS
# the destructive suites instead of failing.
addopts = "--strict-markers"
markers = [
    "live: requires an explicitly configured external service fixture",
    "fullstack: requires isolated YouTrack, IronRAG, provider and connector containers",
]

[tool.coverage.run]
source = ["src/ironrag_connector"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
