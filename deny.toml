[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.19 hard-denies vulnerability advisories by default unless an
# advisory is explicitly ignored below; the `vulnerability = "deny"` key was
# removed by cargo-deny and is rejected by the validator.
yanked = "deny"
# cargo-deny 0.19 models unmaintained and unsound advisories as scope
# selectors; enabling all scopes emits warnings for informational advisories.
unmaintained = "all"
unsound = "all"
# RUSTSEC-2026-0253 requires LruCache::pop(), a panic from the stored key's Drop,
# catching that panic, and then another cache operation. aws-sdk-s3 1.137.0 only
# calls get_or_insert_mut on LruCache<CacheKey(String), _>; CacheKey has no custom
# Drop. The SDK requires lru ^0.16.3, so the patched lru >=0.18.2 is not semver
# compatible; current upstream aws-sdk-s3 1.141.0 retains the same constraint.
# Review and remove by 2026-09-13, or earlier when aws-sdk-s3 permits lru 0.18.2.
#
# RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack) has no patched release:
# `patched = []`. IronRAG never runs an RSA private-key operation. Production
# reaches rsa only through openidconnect's ID-token signature verification
# against the IdP's public JWKS, and the direct dependency is the optional
# `test-support` mock IdP. Review and remove by 2027-03-19, or earlier when a
# release with constant-time padding ships.
ignore = [
    { id = "RUSTSEC-2026-0253", reason = "aws-sdk-s3 does not call vulnerable LruCache::pop and its String-backed key cannot panic in Drop; review by 2026-09-13 or when upstream permits lru >=0.18.2" },
    { id = "RUSTSEC-2023-0071", reason = "rsa performs only public-key ID-token verification via openidconnect, and the direct dependency drives the test-support mock IdP; no RSA private-key operation runs in production and upstream has no patched release; review by 2027-03-19 or when rsa ships constant-time padding" },
]
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = [
    { crate = "native-tls", reason = "Backend TLS must stay on the required rustls stack." },
    { crate = "openssl", reason = "Backend TLS must stay on the required rustls stack." },
    { crate = "openssl-sys", reason = "Backend TLS must stay on the required rustls stack." },
    { crate = "openssl-src", reason = "Backend TLS must stay on the required rustls stack." },
    { crate = "serde_yml", reason = "YAML support must not use the unsound serde_yml crate." },
    { crate = "yaml-rust", reason = "YAML support must stay on the maintained YAML stack." },
]
skip = []
skip-tree = []

[licenses]
version = 2
# GPL and AGPL family licenses are denied by omission from this allow-list.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
unused-license-exception = "deny"
include-dev = true
include-build = true
exceptions = [
    { crate = "webpki-root-certs@1.0.8", allow = ["CDLA-Permissive-2.0"] },
    { crate = "webpki-roots@1.0.8", allow = ["CDLA-Permissive-2.0"] },
    { crate = "xxhash-rust@0.8.16", allow = ["BSL-1.0"] },
]

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
