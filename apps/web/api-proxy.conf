# Proxy semantics shared by the bundled web proxy's API locations: the generic
# /v1/ prefix and the exact-job execute route. Both the plain HTTP and the TLS
# server block include this file, so the two modes cannot drift apart.
# Deployment substitutions and the per-route read budget stay in the templates.

gzip off;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Stream upstream responses verbatim. Backend returns chunked+gzip/zstd
# streaming bodies (graph topology NDJSON, snapshot export); nginx default
# buffering re-frames those and truncates the trailing zero-length chunk,
# producing ERR_INCOMPLETE_CHUNKED_ENCODING in the browser.
# NB: only response buffering is disabled. proxy_request_buffering is left at
# default (on) — disabling it forces every POST to stream-forward as HTTP/1.1
# chunked, which axum + the small JSON bodies we exchange for
# /v1/query/sessions and /v1/mcp tool-calls handled pathologically (request
# hung at the FE nginx layer with no log line, never reached backend).
# Streaming snapshot uploads use their own location, so request buffering
# stays on for these API locations.
proxy_buffering off;
